name: Exact research checks
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Replay rational and symbolic certificates
        run: |
          mkdir -p ci-results
          python verify_ce_counterexample.py > ci-results/original-normal.json
          python -O verify_ce_counterexample.py > ci-results/original-optimized.json
          python independent_pauli_check.py > ci-results/pauli.json
          python verify_extensions.py --negative-controls > ci-results/extensions-normal.json
          python -O verify_extensions.py --negative-controls > ci-results/extensions-optimized.json
          cmp ci-results/extensions-normal.json ci-results/extensions-optimized.json
      - uses: actions/upload-artifact@v4
        with:
          name: exact-check-results
          path: ci-results/
